name: Portfolio quality checks

on:
  push:
    branches: [main, portfolio-architecture-five-case-studies-2026-11]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate site assets and links
        run: node scripts/check-site.mjs

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright test package
        run: npm install --no-audit --no-fund
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile interactions
        run: npm test
      - name: Upload diagnostic traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-traces
          path: test-results/
          retention-days: 7
